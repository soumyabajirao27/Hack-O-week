<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactCheckify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            width: 350px;
            background-color: #f8fafc;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4">

    <div class="flex items-center space-x-3">
        <img src="images/icon48.png" alt="FactCheckify Logo" class="w-10 h-10">
        <h1 class="text-2xl font-bold text-gray-800">FactCheckify</h1>
    </div>

    <p class="mt-2 text-sm text-gray-600">Check the reliability of the current news source.</p>

    <div class="mt-4 p-3 bg-gray-100 rounded-lg">
        <p class="text-xs text-gray-500 font-medium">CURRENT SITE</p>
        <p id="currentUrl" class="text-sm text-gray-700 truncate font-semibold">Loading...</p>
    </div>

    <button id="checkButton" class="mt-4 w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
        Analyze Source
    </button>

    <div id="loader" class="hidden mx-auto mt-6 loader"></div>

    <div id="result" class="hidden mt-4 p-4 rounded-lg">
        <h2 id="resultTitle" class="text-lg font-bold"></h2>
        <p id="resultMessage" class="text-sm mt-1"></p>
    </div>

    <script src="popup.js"></script>
</body>
</html>
